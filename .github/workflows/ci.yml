name: Zeno CI & Regression Suite

on:
  push:
    branches: [main, MacBook, windows]
  pull_request:
    branches: [main, MacBook, windows]

jobs:
  test:
    name: Engine, Service & Zeno v2.0.0 Checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & libsndfile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            service/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: subtitles/package-lock.json

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r service/requirements.txt
          npm --prefix subtitles ci --no-audit --no-fund

      - name: Check Desktop App & Subtitle JS Syntax
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/renderer/app.js
          node --check subtitles/caption-renderer.js
          node --check subtitles/render_cues.js
          node --check subtitles/render_flashcard.js
          node --check subtitles/render_page.js

      - name: Run Zeno Engine Regression Suite
        run: python3 -m unittest discover -s tests -v

      - name: Run Service, Google OAuth & Learnings Tests
        run: |
          python3 service/test_keys.py
          python3 service/check_prompt_sync.py
          python3 service/test_service.py --no-live

      - name: Zeno v2.0.0 Doc Sync & Artifact Hygiene Check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          claude_bytes = (root / "CLAUDE.md").read_bytes()
          agents_bytes = (root / "AGENTS.md").read_bytes()
          assert claude_bytes == agents_bytes, "CLAUDE.md and AGENTS.md must match byte-for-byte"

          claude_md = claude_bytes.decode("utf-8")
          agents_md = agents_bytes.decode("utf-8")
          readme_md = (root / "README.md").read_text(encoding="utf-8")
          settings_json = (root / ".claude" / "settings.json").read_text(encoding="utf-8")

          required_markers = [
              "~/Downloads/Zeno Outs/",
              "--queue",
              "--execute",
              "scripts/zeno.py",
          ]
          for doc_name, content in (
              ("CLAUDE.md", claude_md),
              ("AGENTS.md", agents_md),
              ("README.md", readme_md),
          ):
              for marker in required_markers:
                  assert marker in content, f"Missing Zeno v2.0.0 marker {marker!r} in {doc_name}"

          forbidden_artifacts = [
              "agent",
              "styles",
              "config",
              "scripts/zeno_mcp.py",
              "scripts/ai_director.py",
              "scripts/direct_mode.py",
              "scripts/brain_memory.py",
          ]
          present = [p for p in forbidden_artifacts if (root / p).exists() or (root / p).is_symlink()]
          assert not present, f"Forbidden 1.x / MCP / auto-plan artifacts still present: {present}"

          forbidden_tokens = ["--auto-plan", "zeno_mcp.py"]
          for fname, content in (
              ("AGENTS.md", agents_md),
              ("CLAUDE.md", claude_md),
              (".claude/settings.json", settings_json),
          ):
              for tok in forbidden_tokens:
                  assert tok not in content, f"Forbidden token {tok!r} found in {fname}"

          print("[OK] Zeno v2.0.0 doc sync, required markers, and artifact hygiene verified.")
          PY

  windows-fonts-smoke:
    name: Windows Indic Subtitles & Flashcard Font Smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: subtitles/package-lock.json

      - name: Install subtitle dependencies & Windows user fonts
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless
          npm --prefix subtitles ci --no-audit --no-fund
          python scripts/subtitles.py --ensure-fonts

      - name: Verify 9-script Indic subtitle & flashcard rendering (0 Pango warnings, 0 tofu boxes)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $smokePath = Join-Path $env:RUNNER_TEMP "indic_smoke.py"
          $code = @'
          import sys
          sys.path.insert(0, "scripts")
          import subtitles
          import ui_generator

          ok, msg = subtitles.verify_indic_render_probe()
          assert ok, f"Indic preflight probe failed on Windows: {msg}"

          samples = [
              ("kannada", "\u0ca8\u0ca8\u0ccd\u0ca8\u0ca8\u0ccd\u0ca8\u0cc1 \u0ca8\u0c82\u0cac\u0cc1 please wait"),
              ("hindi", "\u092f\u0939 \u0938\u0939\u0940 \u0939\u0948 listen carefully"),
              ("tamil", "\u0b87\u0b99\u0bcd\u0b95\u0bc7 \u0bb5\u0bbe\u0bb0\u0bc1\u0b99\u0bcd\u0b95\u0bb3\u0bcd thank you"),
              ("telugu", "\u0c28\u0c2e\u0c38\u0c4d\u0c15\u0c3e\u0c30\u0c02 let us begin"),
              ("malayalam", "\u0d28\u0d2e\u0d38\u0d4d\u0d15\u0d3e\u0d30\u0d02 welcome back"),
              ("bengali", "\u09a8\u09ae\u09b8\u09cd\u0995\u09be\u09b0 please stay"),
              ("gujarati", "\u0aa8\u0aae\u0ab8\u0acd\u0aa4\u0ac7 thank you"),
              ("punjabi", "\u0a38\u0a24 \u0a38\u0a4d\u0a30\u0a40 \u0a05\u0a15\u0a3e\u0a32 welcome"),
              ("odia", "\u0b28\u0b2e\u0b38\u0b4d\u0b15\u0b3e\u0b30 welcome"),
          ]
          for lang, text in samples:
              p_ok, p_detail = subtitles.probe_text_render(text, style_id=4)
              assert p_ok, f"Windows {lang} render failed: {p_detail}"
              font = ui_generator.load_ui_font(48, text=text, bold=True)
              assert font is not None, f"ui_generator failed to load font for {lang}"
              script = ui_generator.detect_text_script(text)
              sample_chars = ui_generator._sample_script_chars(text, script)
              assert ui_generator._font_supports_chars(font, sample_chars), f"Font lacks glyphs for {lang}"
          print(f"[OK] Windows Indic probe + all {len(samples)} Indic scripts passed with 0 Pango warnings and 0 tofu boxes.")
          '@
          [System.IO.File]::WriteAllText($smokePath, $code, [System.Text.UTF8Encoding]::new($false))
          python -X utf8 $smokePath
