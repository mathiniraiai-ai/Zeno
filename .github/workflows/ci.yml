name: Zeno CI & Regression Suite

on:
  push:
    branches: [main, MacBook, windows]
  pull_request:
    branches: [main, MacBook, windows]

jobs:
  test:
    name: Engine, Service & Zeno v2.0.0 Checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & libsndfile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            service/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: subtitles/package-lock.json

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt -r service/requirements.txt
          npm --prefix subtitles ci --no-audit --no-fund

      - name: Check Desktop App & Subtitle JS Syntax
        run: |
          node --check app/main.js
          node --check app/preload.js
          node --check app/renderer/app.js
          node --check subtitles/caption-renderer.js
          node --check subtitles/render_cues.js
          node --check subtitles/render_flashcard.js
          node --check subtitles/render_page.js

      - name: Run Zeno Engine Regression Suite
        run: python3 -m unittest discover -s tests -v

      - name: Run Service, Google OAuth & Learnings Tests
        run: |
          python3 service/test_keys.py
          python3 service/check_prompt_sync.py
          python3 service/test_service.py --no-live

      - name: Zeno v2.0.0 Doc Sync & Artifact Hygiene Check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          claude_bytes = (root / "CLAUDE.md").read_bytes()
          agents_bytes = (root / "AGENTS.md").read_bytes()
          assert claude_bytes == agents_bytes, "CLAUDE.md and AGENTS.md must match byte-for-byte"

          claude_md = claude_bytes.decode("utf-8")
          agents_md = agents_bytes.decode("utf-8")
          readme_md = (root / "README.md").read_text(encoding="utf-8")
          settings_json = (root / ".claude" / "settings.json").read_text(encoding="utf-8")

          required_markers = [
              "~/Downloads/Zeno Outs/",
              "--queue",
              "--execute",
              "scripts/zeno.py",
          ]
          for doc_name, content in (
              ("CLAUDE.md", claude_md),
              ("AGENTS.md", agents_md),
              ("README.md", readme_md),
          ):
              for marker in required_markers:
                  assert marker in content, f"Missing Zeno v2.0.0 marker {marker!r} in {doc_name}"

          forbidden_artifacts = [
              "agent",
              "styles",
              "config",
              "scripts/zeno_mcp.py",
              "scripts/ai_director.py",
              "scripts/direct_mode.py",
              "scripts/brain_memory.py",
          ]
          present = [p for p in forbidden_artifacts if (root / p).exists() or (root / p).is_symlink()]
          assert not present, f"Forbidden 1.x / MCP / auto-plan artifacts still present: {present}"

          forbidden_tokens = ["--auto-plan", "zeno_mcp.py"]
          for fname, content in (
              ("AGENTS.md", agents_md),
              ("CLAUDE.md", claude_md),
              (".claude/settings.json", settings_json),
          ):
              for tok in forbidden_tokens:
                  assert tok not in content, f"Forbidden token {tok!r} found in {fname}"

          print("[OK] Zeno v2.0.0 doc sync, required markers, and artifact hygiene verified.")
          PY
