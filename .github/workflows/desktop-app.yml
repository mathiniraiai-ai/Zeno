name: Zeno desktop app
# Builds the installers for the desktop app (app/): Mac (Apple Silicon) .dmg and Windows .exe.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-app.yml'
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: zeno-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
