name: Zeno desktop app
# Builds the installers for the desktop app (app/): Mac (.dmg, arm64 + x64) and Windows (.exe).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-app.yml'
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: app/dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: app/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          node --check scripts/afterSign.js
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: zeno-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
