<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeno Notification</title>
<style>
:root {
  --panel: #0A0A0A;
  --line: #1f1f1f;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --faint: #64748B;
  --green: #bacf65;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: transparent; overflow: hidden;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
}
.stage { width: 100%; height: 100%; padding: 10px; display: flex; align-items: flex-start; overflow: hidden; }
.toast {
  width: 100%;
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 14px 14px 14px;
  cursor: default;
  animation: swipeIn .42s cubic-bezier(.22, 1, .36, 1) forwards;
}
.toast.closing { animation: swipeOut .34s cubic-bezier(.5, 0, .75, 0) forwards; }
@keyframes swipeIn  { from { transform: translateX(115%); } to { transform: translateX(0); } }
@keyframes swipeOut { from { transform: translateX(0); } to { transform: translateX(115%); } }

.mark {
  width: 32px; height: 32px; flex: none; border-radius: 8px;
  background: #000; border: 1px solid var(--line);
  display: grid; place-items: center;
}
.mark i { width: 12px; height: 12px; border-radius: 3.5px; background: var(--green); display: block; }
.body { flex: 1; min-width: 0; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.kicker { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
.close { background: none; border: 0; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 2px; cursor: pointer; }
.close:hover { color: var(--text); }
.title {
  margin: 0 0 6px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
}
.row { font-size: 12px; color: var(--muted); line-height: 1.45; }
.row .label { color: var(--faint); }
.row.path { font: 500 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.row.note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div class="stage">
  <div class="toast" id="toast">
    <div class="mark" aria-hidden="true"><i></i></div>
    <div class="body">
      <div class="head">
        <span class="kicker">__BADGE__</span>
        <button class="close" id="btnClose" aria-label="Dismiss">&times;</button>
      </div>
      <h3 class="title">__TITLE__</h3>
      __DETAILS__
    </div>
  </div>
</div>
<script>
(function () {
  const toast = document.getElementById('toast');
  let closed = false;
  function emit(action) {
    if (closed) return;
    closed = true;
    toast.classList.add('closing');
    setTimeout(() => {
      try { window.webkit.messageHandlers.zenoAction.postMessage(action); }
      catch (e) { window.location.href = 'zeno-action://' + action; }
    }, 360);
  }
  document.getElementById('btnClose').addEventListener('click', () => emit('close'));
  toast.addEventListener('click', (e) => { if (e.target.id !== 'btnClose') emit('close'); });
  setTimeout(() => emit('timeout'), __DURATION_MS__);
})();
</script>
</body>
</html>
