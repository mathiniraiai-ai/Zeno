# Zeno v2.0.0 — Zero-MCP, Minimal-Cache Codex Project Configuration
# Automatically applied whenever Zeno is opened directly in Codex.
model_reasoning_effort = "low"
model_instructions_file = "../AGENTS.md"
# Allow Zeno Cloud + Google Docs network access and writing deliveries to ~/Downloads/Zeno Outs/
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
network_access = true

[features]
web_search_request = false
# Allow 1 isolated subagent per queued video in 2+ video Host-AI Direct batches
multi_agent = true

[apps._default]
enabled = false

[mcp_servers.node_repl]
command = "true"
enabled = false

[mcp_servers.hostinger-agency-hosting]
command = "true"
enabled = false

[mcp_servers.hostinger-billing]
command = "true"
enabled = false

[mcp_servers.hostinger-dns]
command = "true"
enabled = false

[mcp_servers.hostinger-domains]
command = "true"
enabled = false

[mcp_servers.hostinger-hosting]
command = "true"
enabled = false

[mcp_servers.hostinger-reach]
command = "true"
enabled = false

[mcp_servers.hostinger-vps]
command = "true"
enabled = false

[mcp_servers.hostinger-wordpress]
command = "true"
enabled = false

[mcp_servers.hostinger-wordpress-sites]
command = "true"
enabled = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

